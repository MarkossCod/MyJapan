; Sem estes ajustes, um erro do Laravel vira 500 silencioso no Render.
;
; O php-fpm descarta a saída dos workers por padrão, então tudo que a
; aplicação escreve em php://stderr (o canal `stderr` de log do Laravel)
; some antes de chegar ao log do Render.

[global]
error_log = /proc/self/fd/2

[www]
; Repassa stdout/stderr dos workers para o log do container.
catch_workers_output = yes
decorate_workers_output = no

; Mantém as variáveis de ambiente do container visíveis para o PHP.
; Por padrão o php-fpm limpa o ambiente dos workers.
clear_env = no

; Erros de PHP no log do container, não na resposta HTTP.
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
