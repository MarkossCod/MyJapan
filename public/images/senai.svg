<?xml version="1.0" encoding="UTF-8"?>
<!--
    Reconstrução vetorial da placa do SENAI usada na página "Quem somos".

    Por que redesenhar em vez de usar o PNG: a arte entra dentro de um recorte
    SVG com `preserveAspectRatio="slice"`, que corta as bordas para preencher a
    forma. O logo original é muito largo (proporção ~6:1) e seria decapitado nas
    laterais. Aqui a arte foi montada num quadro 1000x400 (2.5:1, a mesma
    proporção do recorte), com a placa centralizada e margem sobrando — assim o
    `slice` preenche sem cortar nada.

    As medidas seguem o original: bloco das marcas à esquerda, faixa central com
    as barras verticais e a palavra SENAI, bandeira do Japão à direita.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="SENAI — FIEPE, CIEPE, SESI, SENAI, IEL — e a bandeira do Japão">
    <rect width="1000" height="400" fill="#ffffff"/>

    <!-- Não mexa no x=80 sem conferir o recorte: o clip-path da seção tem um
         degrau na lateral esquerda, e a placa mais à esquerda que isso entra
         na área cortada. -->
    <g transform="translate(80 145)">
        <!-- Bloco das cinco marcas do sistema. -->
        <rect x="0" y="0" width="118" height="110" fill="#c8102e"/>
        <g fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-style="italic" font-size="15.5" text-anchor="middle">
            <text x="59" y="26">FIEPE</text>
            <text x="59" y="46">CIEPE</text>
            <text x="59" y="66">SESI</text>
            <text x="59" y="86">SENAI</text>
            <text x="59" y="106">IEL</text>
        </g>
        <!-- Filetes que separam as marcas, como no original. -->
        <g fill="#ffffff">
            <rect x="18" y="30" width="82" height="1.6"/>
            <rect x="18" y="50" width="82" height="1.6"/>
            <rect x="18" y="70" width="82" height="1.6"/>
            <rect x="18" y="90" width="82" height="1.6"/>
        </g>

        <!-- Faixa central. -->
        <g transform="translate(140 0)">
            <rect x="0" y="0" width="560" height="110" fill="#c8102e"/>

            <!-- Barras horizontais das duas pontas: no original elas sugerem
                 movimento, afinando a faixa nas extremidades. -->
            <g fill="#ffffff">
                <rect x="8" y="10" width="34" height="6"/>
                <rect x="8" y="26" width="34" height="6"/>
                <rect x="8" y="42" width="34" height="6"/>
                <rect x="8" y="58" width="34" height="6"/>
                <rect x="8" y="74" width="34" height="6"/>
                <rect x="8" y="90" width="34" height="6"/>

                <rect x="518" y="10" width="34" height="6"/>
                <rect x="518" y="26" width="34" height="6"/>
                <rect x="518" y="42" width="34" height="6"/>
                <rect x="518" y="58" width="34" height="6"/>
                <rect x="518" y="74" width="34" height="6"/>
                <rect x="518" y="90" width="34" height="6"/>
            </g>

            <text x="280" y="84" fill="#ffffff" text-anchor="middle"
                  font-family="Arial Black, Arial, Helvetica, sans-serif"
                  font-weight="900" font-style="italic" font-size="84" letter-spacing="1">SENAI</text>
        </g>

        <!-- Bandeira do Japão. -->
        <g transform="translate(722 0)">
            <rect x="0" y="0" width="160" height="110" fill="#ffffff" stroke="#d8d5cd" stroke-width="1.5"/>
            <circle cx="80" cy="55" r="33" fill="#c8102e"/>
        </g>
    </g>
</svg>
