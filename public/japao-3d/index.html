<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3efe7" />
    <meta name="description" content="Uma experiência 3D interativa inspirada na bandeira e na cultura do Japão." />
    <title>Japão — tradição em movimento</title>
    <script>
      /*
        Portão de requestAnimationFrame.

        Esta página roda uma simulação de tecido em WebGL que continuava
        consumindo CPU/GPU mesmo depois que o usuário rolava para longe do
        hero. Como o script do 3D é um bundle já compilado, em vez de mexer
        nele interceptamos o rAF: quando a home avisa que o iframe saiu da
        tela, as chamadas passam a ser enfileiradas em vez de agendadas, e o
        loop simplesmente para. Ao voltar, a fila é liberada e ele retoma.

        Este script é clássico (não module), então roda antes do bundle e
        garante que o override já esteja no lugar quando o three.js capturar
        a referência de requestAnimationFrame.
      */
      (function () {
        /*
          São dois motivos independentes para parar, e eles precisam ser
          rastreados separadamente: se guardássemos um único booleano, voltar
          para a aba (visibilitychange) religaria a cena mesmo com o hero
          fora da tela. Só roda quando as duas condições permitem.
        */
        var foraDaTela = false;
        var abaOculta = document.hidden;
        var pendentes = [];
        var quadros = 0;
        var rafNativo = window.requestAnimationFrame.bind(window);

        function pausado() {
          return foraDaTela || abaOculta;
        }

        window.requestAnimationFrame = function (cb) {
          if (pausado()) {
            pendentes.push(cb);
            return 0;
          }

          return rafNativo(function (t) {
            quadros++;
            cb(t);
          });
        };

        function reavaliar() {
          if (pausado()) return;

          var fila = pendentes.splice(0, pendentes.length);
          fila.forEach(function (cb) {
            window.requestAnimationFrame(cb);
          });
        }

        window.addEventListener('message', function (e) {
          if (e.source !== window.parent) return;
          if (e.data === 'japao3d:pausar') foraDaTela = true;
          else if (e.data === 'japao3d:retomar') foraDaTela = false;
          else return;

          reavaliar();
        });

        document.addEventListener('visibilitychange', function () {
          abaOculta = document.hidden;
          reavaliar();
        });

        // Usado para conferir, do lado de fora, se o loop realmente parou.
        window.__japao3d = {
          get pausado() {
            return pausado();
          },
          get foraDaTela() {
            return foraDaTela;
          },
          get abaOculta() {
            return abaOculta;
          },
          get quadros() {
            return quadros;
          },
        };
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-Dhd7dGo4.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DOPnJIng.css">
    <style>
      /* Esta página é embutida em um iframe na home. Escondemos a barra de
         rolagem interna para não aparecerem duas barras lado a lado.
         A rolagem continua funcionando — apenas a barra fica invisível. */
      html {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        width: 0;
        height: 0;
        display: none;
      }

      /* ---------------------------------------------------------------------
         Título do hero mais largo.

         O CSS do bundle (assets/index-*.css) é minificado e gerado por build,
         então os ajustes ficam aqui: esta folha vem depois do <link>, logo
         ganha na cascata sem precisar editar o arquivo compilado.
      --------------------------------------------------------------------- */

      /* A coluna de texto era 0.76fr contra 1.24fr do palco 3D, o que deixava
         o título comprimido num bloco estreito. Agora as duas colunas ficam
         quase iguais, sem apertar a bandeira. */
      .hero {
        /* 0.92fr deixava ~770px úteis para o título, e "Conheça mais" precisa
           de ~790px na fonte máxima — faltava pouco, e a linha quebrava em
           três. Com 1.02fr sobra folga sem apertar a bandeira. */
        grid-template-columns: minmax(20rem, 1.02fr) minmax(25rem, 0.98fr);
      }

      .copy {
        max-width: 56rem;
        /* O recuo original chegava a 7.5rem e roubava largura justamente de
           onde o título precisa crescer. */
        padding-left: clamp(1.75rem, 4.6vw, 5rem);
        padding-right: 1.5rem;
        /* Sem isso o tamanho mínimo do conteúdo do título empurraria a coluna
           para além da proporção definida no grid. */
        min-width: 0;
      }

      /* O `max-width: 9.5ch` original cortava o título em três linhas
         ("Conheça" / "mais" / "o Japão."). Liberando a largura, a quebra
         volta a ser só a do <br>: duas linhas largas e alinhadas. */
      #hero-title {
        max-width: none;
        /* Os valores vêm de medição, não de chute: a maior linha ("Conheça
           mais") ocupa ~5.03em de largura, e a coluna útil é ~46% da janela
           menos os recuos. 8vw / 9rem deixa a linha em ~92% da coluna — o
           máximo que cresce sem arriscar uma terceira linha. */
        font-size: clamp(3.6rem, 8vw, 9rem);
        /* 0.79 do original encostava a cedilha de "Conheça" no "Japão" agora
           que o corpo do texto é maior. */
        line-height: 0.88;
        /* Um pouco mais fechado que os -0.045em originais: no corpo grande, o
           espaçamento normal faz o título parecer solto em vez de compacto. */
        letter-spacing: -0.055em;
      }

      /* O título só "pesa" se o resto recuar. Mais respiro abaixo dele e um
         apoio menor deixam a hierarquia óbvia sem precisar de mais enfeite. */
      .lede {
        margin-top: 2.8rem;
        max-width: 29rem;
        font-size: clamp(0.92rem, 1vw, 1.02rem);
      }

      @media (max-width: 800px) {
        .copy {
          max-width: none;
          padding-left: 1.35rem;
          padding-right: 1.35rem;
        }

        #hero-title {
          font-size: clamp(3.6rem, 17vw, 6rem);
          line-height: 0.88;
        }
      }
    </style>
  </head>
  <body>
    <main class="hero">
      <section class="copy" aria-labelledby="hero-title">
        <p class="eyebrow">日本 · JAPÃO</p>
        <h1 id="hero-title">Conheça mais<br />o <em>Japão.</em></h1>
        <p class="lede">Entre templos silenciosos, cidades vibrantes e paisagens que mudam a cada estação, há sempre um novo Japão para descobrir.</p>
      </section>

      <section class="stage" aria-label="Bandeira 3D interativa do Japão">
        <div id="canvas-wrap" tabindex="0" role="application" aria-label="Arraste a bandeira para fazê-la balançar. Arraste fora dela para girar. Use as setas do teclado para girar e a barra de espaço para criar uma rajada.">
          <canvas id="scene"></canvas>
          <div class="hint" aria-hidden="true">
            <span class="gesture">⌁</span>
            <span><strong>Arraste a bandeira</strong> para criar movimento</span>
          </div>
          <div class="loader" id="loader"><span></span><p>Preparando a experiência</p></div>
        </div>
        <button class="recenter" id="recenter" type="button" aria-label="Centralizar a bandeira na tela">
          <span class="recenter-icon" aria-hidden="true">◎</span>
          <span>Centralizar</span>
        </button>
      </section>

      <div class="sun-mark" aria-hidden="true"></div>
    </main>
  </body>
</html>
